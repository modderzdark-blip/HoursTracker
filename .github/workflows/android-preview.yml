name: Android preview APK

on:
  push:
    branches:
      - main
      - 'ccr-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_TAG: ashbound-preview
  APK_NAME: Ashbound-preview.apk

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Install
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build web
        run: npm run build
        env:
          BUILD_SHA: ${{ github.sha }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Gradle assembleDebug
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          ls -la "$APK_NAME"
          sha256sum "$APK_NAME"

      - uses: actions/upload-artifact@v6
        with:
          name: ashbound-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish to the "ashbound-preview" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Preview build #${GITHUB_RUN_NUMBER} from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Test build signed with a public key — not a store release."
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Ashbound preview (Android APK)" --notes "$NOTES"
          fi
          gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
          gh release edit "$RELEASE_TAG" --notes "$NOTES"
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${APK_NAME}"
