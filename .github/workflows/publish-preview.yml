name: Publish preview APK from a finished build

# One-off, owner request: runs only when this file changes on the work branch.
on:
  push:
    branches: ['ccr-**']
    paths: ['.github/workflows/publish-preview.yml']

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: apks
          path: dist
          run-id: 37855081334
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish "preview" pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          APK=$(ls dist/SweetCascade-v*.apk | head -1)
          sha256sum "$APK"
          gh release delete preview --cleanup-tag --yes || true
          gh release create preview "$APK" --prerelease \
            --target 7879146f3ea16f97296272a46c841a203036d20c \
            --title "Sweet Cascade preview (CI run 11)" \
            --notes "APK built by CI run 11 (commit 7879146): classic candy shapes, deep-blue board, candy goals only, easier stars, map flow after a win. Logic, browser, build and APK verification passed; the emulator run was stopped by an unrelated system dialog (Pixel Launcher not responding) and is being re-run. Published early at the owner's request. Install: open this file on your phone, allow installing from your browser if asked, tap Install."
