name: Publish preview APK from a finished build

# One-off, owner request: runs only when this file changes on the work branch.
on:
  push:
    branches: ['ccr-**']
    paths: ['.github/workflows/publish-preview.yml']

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: apks
          path: dist
          run-id: 37855081334
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach the APK to the existing "qa" pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          cp "$(ls dist/SweetCascade-v*.apk | head -1)" SweetCascade-v1.0.0-preview.apk
          sha256sum SweetCascade-v1.0.0-preview.apk
          gh release upload qa SweetCascade-v1.0.0-preview.apk --clobber
          echo "APK: https://github.com/${GH_REPO}/releases/download/qa/SweetCascade-v1.0.0-preview.apk"
