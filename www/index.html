<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ff9ad5">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'none'; connect-src 'self'; font-src 'none'; object-src 'none'; base-uri 'none'">
<title>Sweet Cascade</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" class="app">
  <canvas id="bg-canvas" class="layer-canvas" aria-hidden="true"></canvas>
  <div id="photo-layer" class="photo-layer" aria-hidden="true"><div id="photo-image" class="photo-image"></div><div class="photo-tint"></div></div>
  <canvas id="game-canvas" class="layer-canvas game-canvas" aria-hidden="true"></canvas>

  <section id="screen-title" class="screen screen-title" aria-label="Title screen">
    <div id="title-candies" class="title-candies" aria-hidden="true"></div>
    <div class="title-stack">
      <h1 class="logo">
        <span class="glossy-text logo-line" id="logo-line-1" data-text="Sweet">Sweet</span>
        <span class="glossy-text logo-line logo-line-2" id="logo-line-2" data-text="Cascade">Cascade</span>
      </h1>
      <canvas id="title-pip" class="title-pip" aria-hidden="true"></canvas>
      <p id="title-greeting" class="greeting"></p>
      <button id="btn-play" class="pill pill-big" type="button" aria-label="Play">Play</button>
      <div class="title-row">
        <button id="btn-title-settings" class="round" type="button" aria-label="Settings" data-icon="gear"></button>
        <button id="btn-title-help" class="round" type="button" aria-label="How to play" data-icon="help"></button>
      </div>
    </div>
    <p class="version" id="title-version"></p>
  </section>

  <section id="screen-map" class="screen screen-map" aria-label="Level map">
    <div id="map-scroll" class="map-scroll">
      <div id="map-inner" class="map-inner">
        <div id="map-stage" class="map-stage">
          <canvas id="map-canvas" class="map-canvas" aria-hidden="true"></canvas>
          <div id="map-nodes" class="map-nodes"></div>
        </div>
      </div>
    </div>
    <header class="map-topbar">
      <button id="btn-map-back" class="topbar-round" type="button" aria-label="Back to title" data-icon="back"></button>
      <button id="map-hearts" class="topbar-chip chip-hearts" type="button" aria-label="Hearts"><img id="map-hearts-icon" alt=""><span id="map-hearts-count" class="chip-heart-count">5</span><small id="map-hearts-timer">Full</small></button>
      <button id="map-avatar" class="topbar-avatar" type="button" aria-label="Your progress"><span id="map-avatar-face" class="avatar-face"></span></button>
      <button id="map-gold" class="topbar-chip chip-gold" type="button" aria-label="Gold"><img id="map-gold-icon" alt=""><span id="map-gold-count">0</span></button>
      <button id="btn-map-settings" class="topbar-round" type="button" aria-label="Settings" data-icon="gear"></button>
    </header>
    <div class="map-side">
      <button id="btn-map-wheel" class="side-event has-badge" type="button" aria-label="Daily Wheel"><span class="side-event-art" data-icon="wheel"></span><span id="map-wheel-caption" class="side-event-caption">Spin!</span></button>
    </div>
    <button id="btn-map-mine" class="map-mine" type="button" aria-label="Jump to my level"><span id="map-mine-face" class="avatar-face"></span><span class="map-mine-arrow" data-icon="up"></span></button>
    <nav class="map-nav" aria-label="Map menu">
      <button id="btn-map-tab-map" class="nav-tab is-active" type="button" aria-label="Map" aria-current="page"><span class="nav-glyph" data-icon="map"></span><span class="nav-label">Map</span></button>
      <button id="btn-map-daily" class="nav-tab has-badge" type="button" aria-label="Daily Challenges"><span class="nav-glyph" data-icon="daily"></span><span class="nav-label">Daily</span></button>
      <button id="btn-map-shop" class="nav-tab" type="button" aria-label="Shop"><span class="nav-glyph" data-icon="shop"></span><span class="nav-label">Shop</span></button>
      <button id="btn-map-goto" class="nav-tab" type="button" aria-label="Go to level number"><span class="nav-glyph" data-icon="search"></span><span class="nav-label">Find</span></button>
    </nav>
  </section>

  <section id="screen-game" class="screen screen-game" aria-label="Game">
    <header id="hud" class="hud">
      <div class="hud-card hud-moves" aria-label="Moves left">
        <span id="hud-moves-label" class="hud-label">Moves</span>
        <span id="hud-moves" class="hud-number">0</span>
      </div>
      <div class="hud-card hud-goals">
        <div id="hud-level" class="hud-level">Level 1</div>
        <div id="hud-goal-list" class="goal-list"></div>
      </div>
      <div class="hud-card hud-stars" aria-label="Goal progress">
        <span class="hud-label">Stars</span>
        <div class="hud-star-row" aria-hidden="true">
          <span class="star-mark" id="star-mark-0"></span>
          <span class="star-mark" id="star-mark-1"></span>
          <span class="star-mark" id="star-mark-2"></span>
        </div>
        <div class="star-bar" aria-hidden="true"><div id="star-fill" class="star-fill"></div></div>
      </div>
    </header>
    <div id="board-slot" class="board-slot"></div>
    <div id="banner" class="banner" aria-hidden="true"></div>
    <div id="goal-ribbon" class="goal-ribbon" aria-hidden="true"></div>
    <div id="tutorial-bubble" class="tutorial-bubble" hidden></div>
    <canvas id="game-pip" class="game-pip" aria-hidden="true"></canvas>
    <footer class="game-bar">
      <button id="btn-pause" class="round" type="button" aria-label="Pause" data-icon="pause"></button>
      <button id="btn-hint" class="round hint-button" type="button" aria-label="Show a hint" data-icon="hint"></button>
      <div class="booster-bar" role="group" aria-label="Boosters">
        <button id="btn-booster-hammer" class="booster" type="button" aria-label="Sweet Hammer" data-booster="hammer"><span class="booster-icon" data-icon="hammer"></span><span class="booster-count">3</span></button>
        <button id="btn-booster-free_swap" class="booster" type="button" aria-label="Free Swap" data-booster="free_swap"><span class="booster-icon" data-icon="swap"></span><span class="booster-count">3</span></button>
        <button id="btn-booster-whirl" class="booster" type="button" aria-label="Candy Whirl" data-booster="whirl"><span class="booster-icon" data-icon="whirl"></span><span class="booster-count">3</span></button>
        <button id="btn-booster-brush" class="booster" type="button" aria-label="Candy Brush" data-booster="brush"><span class="booster-icon" data-icon="brush"></span><span class="booster-count">3</span></button>
        <button id="btn-booster-party" class="booster" type="button" aria-label="Sugar Party" data-booster="party"><span class="booster-icon" data-icon="party"></span><span class="booster-count">2</span></button>
      </div>
      <button id="btn-sound" class="round" type="button" aria-label="Mute sound" data-icon="sound"></button>
    </footer>
  </section>

  <div id="modal-root" class="modal-root" hidden>
    <div class="modal-backdrop"></div>
    <div id="modal-stack" class="modal-stack"></div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="live-region" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
</div>
<input type="file" id="photo-input" accept="image/*" hidden>

<script src="js/config.js"></script>
<script src="js/util.js"></script>
<script src="js/logic.js"></script>
<script src="levels/manifest.js"></script>
<script src="js/levels.js"></script>
<script src="js/audio.js"></script>
<script src="js/sprites.js"></script>
<script src="js/scenery.js"></script>
<script src="js/pip.js"></script>
<script src="js/render.js"></script>
<script src="js/storage.js"></script>
<script src="js/meta.js"></script>
<script src="js/selftest.js"></script>
<script src="js/ui.js"></script>
<script src="js/map.js"></script>
<script src="js/input.js"></script>
<script src="js/game.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
