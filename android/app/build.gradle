import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// versionName comes from package.json, versionCode from the CI run number, so every CI build upgrades the previous one.
def package_json = new JsonSlurper().parse(file('../../package.json'))
def app_version_name = package_json.version
def app_version_code = (System.getenv('VERSION_CODE') ?: '1').toInteger()

// Release signing: the stable keystore is provided by CI secrets (decoded to a temp file).
// When the secrets are absent, release builds fall back to the public sideload key so updates still install over each other.
def release_keystore_path = System.getenv('ANDROID_KEYSTORE_PATH')
def has_release_keystore = release_keystore_path != null && !release_keystore_path.isEmpty() && file(release_keystore_path).exists()

android {
    namespace = "app.sweetcascade.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.sweetcascade.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode app_version_code
        versionName app_version_name
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        sideload {
            storeFile file('../sideload-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (has_release_keystore) {
            release {
                storeFile file(release_keystore_path)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.sideload
        }
        release {
            debuggable false
            minifyEnabled false
            signingConfig has_release_keystore ? signingConfigs.release : signingConfigs.sideload
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets {
        // The emulator test hook ships ONLY in debug builds (verified absent from release by CI).
        debug {
            assets.srcDirs += ['../../tests/android-debug-assets']
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
